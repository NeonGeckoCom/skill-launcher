# Specify resources to test here.

# Specify languages to be tested
languages:
  - "en-us"

# vocab is lowercase .voc file basenames
vocab:
  - browse
  - launch
  - launch_camera_app
  - launch_voice_recorder_app
  - launch_reminders_app
  - launch_clock_app
  - launch_sms_app
  - launch_email_app

# dialog is .dialog file basenames (case-sensitive)
dialog:
  - "dot"
  - "launch_program"
  - "launch_website"
  - "mobile_not_supported"
  - "not_supported"
  - "on"
  - "website_not_found"
  - "native_action_not_supported"
  - "native_action_success"
  - "native_action_timeout"
  - "native_action_error"
  - "launch_camera_app"
  - "launch_voice_recorder_app"
  - "launch_reminders_app"
  - "launch_clock_app"
  - "launch_sms_app"
  - "launch_email_app"

# regex entities, not necessarily filenames
regex:
  - website
intents:
  # Padatious intents are the `.intent` file names
  padatious:
    - launch_program.intent
  # Adapt intents are the name passed to the constructor
  adapt:
    - BrowseWebsiteIntent
